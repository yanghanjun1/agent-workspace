name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependency install step on purpose: the tool is standard library only,
      # and a workflow that needs pip would hide the day that stops being true.
      - name: tests
        run: python -m unittest discover -s tests -v

      - name: tool help
        run: python tools/aw --help
